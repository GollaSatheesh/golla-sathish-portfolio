<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1528" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#00d2ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Glass Base (Apple Style) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#00d2ee" stroke-width="2" stroke-opacity="0.6" />
  
  <!-- Subtle Internal Specular Rim -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25" />

  <!-- GS Monogram Typography -->
  <text 
    x="32" 
    y="41" 
    font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Plus Jakarta Sans', sans-serif" 
    font-size="27" 
    font-weight="900" 
    letter-spacing="-1.5px"
    fill="url(#cyanGrad)" 
    filter="url(#cyanGlow)"
    text-anchor="middle"
  >GS</text>

  <!-- Micro Orbit Satellite Point -->
  <circle cx="50" cy="15" r="2.5" fill="#00d2ee" filter="url(#cyanGlow)" />
</svg>
